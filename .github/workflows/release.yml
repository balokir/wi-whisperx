name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Checked out commit does not match GITHUB_SHA"
            exit 1
          fi

      - name: Build source-only release package
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ZIP="wi-whisperx-${TAG}.zip"
          PREFIX="wi-whisperx-${TAG}/"

          git archive \
            --format=zip \
            --prefix="$PREFIX" \
            --output="$ZIP" \
            "${GITHUB_SHA}"

          HASH="$(sha256sum "$ZIP" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$ZIP" > "$ZIP.sha256"

          echo "RELEASE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"

            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Published release already exists for $TAG"
              exit 1
            fi

            echo "Removing incomplete draft release for $TAG"
            gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes
          fi

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          gh release upload "$TAG" \
            "$RELEASE_ZIP" \
            "$RELEASE_ZIP.sha256" \
            "bootstrap.ps1" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

          echo "Published release: ${GITHUB_REF_NAME}"
